<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="sub-container" id="first-sub-container">
            <input id="display" placeholder="Enter here">
        </div>
        <div class="sub-container" id="second-sub-container">
            <button class="btn-num" id="one">1</button>
            <button class="btn-num" id="two">2</button>
            <button class="btn-num" id="three">3</button>
            <button class="btn-num" id="four">4</button>
            <button class="btn-logical" id="del">DEL</button>
            <button class="btn-num" id="five">5</button>
            <button class="btn-num" id="six">6</button>
            <button class="btn-num" id="seven">7</button>
            <button class="btn-num" id="eight">8</button>
            <button class="btn-logical" id="cc">CC</button>
            <button class="btn-num" id="nine">9</button>
            <button class="btn-num" id="zero">0</button>
            <button class="btn-bitwise" id="bitwisexor">OR</button>
            

            <button class="btn-bitwise" id="bitwiseand">AND</button>
            <button class="btn-bitwise" id="bitwisenot">NOT</button>
            <button class="btn-arithematic" id="add">+</button>
            <button class="btn-arithematic" id="subtract">-</button>
            <button class="btn-arithematic" id="divide">/</button>
            <button class="btn-arithematic" id="multiply">*</button>
            <button class="btn-arithematic" id="expo">^</button>
            <button class="btn-compare" id="lessthan"><</button>
            <button class="btn-compare" id="greatorthan">></button>
            <button class="btn-logical" id="enter">Enter</button>
            
            <button class="btn-compare" id="greatorthanequalto">>=</button>
            <button class="btn-compare" id="lessthanequalto"><=</button>
            
            
            
            
            
            <button class="btn-arithematic" id="modulo">%</button>
            <button class="btn-compare" id="notequalto">!=</button>
            <button class="btn-compare" id="equalto">=</button>

        </div>
    </div>
    
</body>
<script src="script.js"></script>
</html>
