<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="input-container" id="input-container">
            <input id="input" placeholder="Enter here">
        </div>
        <div class="buttons-container" id="buttons-container">
            <button  data-type= "number", data-value = '1', id="one">1</button>
            <button data-type= "number", data-value = '2' id="two">2</button>
            <button data-type= "number", data-value = '3' id="three">3</button>
            <button data-type= "number", data-value = '4' id="four">4</button>
            <button data-type= "action", data-value = 'DEL' id="del">DEL</button>
            <button data-type= "number", data-value = '5' id="five">5</button>
            <button data-type= "number", data-value = '6' id="six">6</button>
            <button data-type= "number", data-value = '7' id="seven">7</button>
            <button data-type= "number", data-value = '8' id="eight">8</button>
            <button data-type= "action", data-value = 'CC' id="cc">CC</button>
            <button data-type= "number", data-value = '9' id="nine">9</button>
            <button data-type= "number", data-value = '0' id="zero">0</button>
            <button data-type= "operator", data-value = 'OR' id="bitwisexor">OR</button>
            

            <button data-type= "operator", data-value = 'AND' id="bitwiseand">AND</button>
            <button data-type= "operator", data-value = 'NOT' id="bitwisenot">NOT</button>
            <button data-type= "operator", data-value = '+' id="add">+</button>
            <button data-type= "operator", data-value = '-' id="subtract">-</button>
            <button data-type= "operator", data-value = '/' id="divide">/</button>
            <button data-type= "operator", data-value = '*' id="multiply">*</button>
            <button data-type= "operator", data-value = '^' id="expo">^</button>
            <button data-type= "operator", data-value = '<' id="lessthan"><</button>
            <button data-type= "operator", data-value = '>' id="greatorthan">></button>
            <button data-type= "action", data-value = 'Enter' id="enter">Enter</button>
            
            <button data-type= "operator", data-value = '>=' id="greatorthanequalto">>=</button>
            <button data-type= "operator", data-value = '<=' id="lessthanequalto"><=</button>
            
            
            <button data-type= "operator", data-value = '%' id="modulo">%</button>
            <button data-type= "operator", data-value = '!=' id="notequalto">!=</button>
            <button data-type= "action", data-value = '=' id="equalto">=</button>

        </div>
    </div>
    
</body>
<script src="script.js"></script>
</html>
